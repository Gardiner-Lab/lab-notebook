name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # Pango, for the PDF exports (WeasyPrint), as the image has it.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the page scripts and table arithmetic
        run: |
          for f in app/static/js/*.js; do node --check "$f"; done
          node tests/js/sheet.test.js
