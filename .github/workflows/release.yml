name: Release

# Pushing a version tag (v0.1.0) tests the code, then publishes the image as
# ghcr.io/gardiner-lab/lab-notebook:0.1.0, :0.1 and :latest, for both Intel
# and ARM servers. The lab suite pins an exact version, so publishing here does
# not change any installation until the suite is updated to use it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gardiner-lab/lab-notebook

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # Pango, for the PDF exports (WeasyPrint), as the image has it.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          for f in app/static/js/*.js; do node --check "$f"; done
          node tests/js/sheet.test.js

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version in the code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(sed -n "s/^APP_VERSION = '\(.*\)'/\1/p" app/main.py)"
          [ "$tag" = "$code" ] || { echo "Tag v$tag but APP_VERSION is $code"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # A release tag also moves :latest (metadata-action's default for semver).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
